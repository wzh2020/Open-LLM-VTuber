name: Foundation Tests

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify optional live-provider and soak runners parse
        run: python -m py_compile scripts/r0_real_provider_smoke.py scripts/r0_live_soak.py

      - name: Run dependency-isolated lifecycle tests
        run: python -m unittest discover -s tests/unit -p "test_*.py" -v

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal ASGI and MCP transport dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "fastapi>=0.115.8,<0.120" \
            "mcp==1.6.0" \
            "pydantic==2.10.6" \
            "numpy>=1.26.4,<2" \
            "loguru>=0.7.2" \
            "python-multipart" \
            "httpx>=0.27"

      - name: Exercise ASGI WebSocket and real MCP stdio subprocesses
        run: python -m unittest discover -s tests/integration -p "test_*.py" -v
