name: Ruff
on: [push, pull_request]

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Enforce correctness checks across the entire repository. The inherited
      # style/modernization debt is audited separately until it is ratcheted down.
      - name: Required correctness lint
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.0"
          args: "check --select E4,E7,E9,F"
      - name: Legacy lint baseline (advisory)
        continue-on-error: true
        run: ruff check --statistics --output-format concise .
